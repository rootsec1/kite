name: Feature request
description: Suggest a Kite workflow or UI improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: What debugging or operations problem should Kite solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the simplest useful workflow or interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention kubectl commands, existing tools, or current Kite workarounds.
  - type: dropdown
    id: writes
    attributes:
      label: Does this require Kubernetes writes?
      options:
        - "No"
        - "Yes, local clusters only"
        - "Yes, needs guarded confirmation"
    validations:
      required: true
