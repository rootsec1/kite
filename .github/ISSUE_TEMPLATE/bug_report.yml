name: Bug report
description: Report a reproducible Kite problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open Kite
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4
    validations:
      required: true
  - type: input
    id: cluster
    attributes:
      label: Kubernetes environment
      placeholder: k3d vX, kind vX, EKS vX, GKE vX
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, kubeconfigs, secrets, and sensitive resource data before attaching.
