[package]
name = "kite"
version = "0.1.0"
description = "A native, UI-first Kubernetes cockpit."
authors = ["Kite contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "kite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
k8s-openapi = { version = "0.27.1", features = ["v1_35"] }
kube = { version = "3.1.0", features = ["runtime", "ws", "derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tauri = { version = "2.10.2", features = ["macos-private-api"] }
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
window-vibrancy = "0.7.1"
